<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quantum Health — Admin</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="login" class="login-wrap hidden">
  <form id="login-form" class="login-card" autocomplete="on">
    <div class="login-brand"><span class="dot"></span> Quantum Health <em>CMS</em></div>
    <p class="muted" id="login-note">Sign in with the administrator account.</p>
    <label>Email <input type="email" id="login-email" autocomplete="username" required></label>
    <label>Password <input type="password" id="login-password" autocomplete="current-password" required></label>
    <label id="totp-row" class="hidden">Two-factor code <input inputmode="numeric" maxlength="6" id="login-code" autocomplete="one-time-code"></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p class="small muted">Forgotten your password? Run <code>node scripts/setup-admin.js --reset</code> on the deployment host.</p>
  </form>
</div>

<div id="shell" class="shell hidden">
  <aside class="side">
    <div class="side-brand"><span class="dot"></span><b>Quantum Health</b><em>Admin</em></div>
    <nav id="nav-menu"></nav>
    <div class="side-foot">
      <a class="linkish" href="/" target="_blank" rel="noopener">Open live site ↗</a>
      <button id="logout" class="btn ghost small">Sign out</button>
    </div>
  </aside>
  <main class="content">
    <header class="topbar"><h1 id="view-title">Dashboard</h1><div id="top-actions"></div></header>
    <div id="view"></div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="modal-x" id="modal-close">×</button><div id="modal-body"></div></div></div>
<div id="media-picker" class="modal hidden"><div class="modal-box wide"><button class="modal-x" id="picker-close">×</button><h3>Media library</h3><div id="picker-grid" class="picker-grid"></div><p class="small muted">Upload new images from Media Library. Click an image to use it.</p></div></div>
<script src="/admin/admin.js"></script>
</body>
</html>
